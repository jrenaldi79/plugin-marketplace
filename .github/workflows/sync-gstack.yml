name: Sync gstack frameworks

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest

      - name: Fetch raw gstack office-hours SKILL.md
        run: |
          curl -sL "https://raw.githubusercontent.com/garrytan/gstack/main/office-hours/SKILL.md" \
            -o sync/fixtures/gstack-office-hours-raw.md

      - name: Fetch raw gstack plan-ceo-review SKILL.md
        run: |
          curl -sL "https://raw.githubusercontent.com/garrytan/gstack/main/plan-ceo-review/SKILL.md" \
            -o sync/fixtures/gstack-ceo-review-raw.md

      - name: Run sync
        id: sync
        working-directory: sync/scripts
        run: |
          python run_sync.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run tests if changes detected
        if: steps.sync.outcome == 'success' || steps.sync.outcome == 'failure'
        working-directory: sync/scripts
        run: pytest test_sync.py -v

      - name: Create PR if changes detected
        if: steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="sync/gstack-$(date +%Y%m%d)-${{ github.run_number }}"
          git checkout -b "$BRANCH"

          # Patch-bump version in all three locations
          CURRENT=$(jq -r '.version' plugins/product-kit/.claude-plugin/plugin.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "Bumping $CURRENT -> $NEW"
          jq --arg v "$NEW" '.version = $v' plugins/product-kit/.claude-plugin/plugin.json > /tmp/plugin.json && mv /tmp/plugin.json plugins/product-kit/.claude-plugin/plugin.json
          jq --arg v "$NEW" '.metadata.version = $v | .plugins[0].version = $v' .claude-plugin/marketplace.json > /tmp/marketplace.json && mv /tmp/marketplace.json .claude-plugin/marketplace.json

          # Prepend a CHANGELOG entry
          python3 - "$NEW" <<'PY'
          import re, sys
          from datetime import datetime, timezone
          new_version = sys.argv[1]
          date_str = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          entry = f"## [{new_version}] - {date_str}\n\n### Changed\n- Auto-sync of upstream gstack framework changes\n\n"
          with open("CHANGELOG.md") as f:
              content = f.read()
          new_content = re.sub(r'(## \[)', entry + r'\1', content, count=1)
          with open("CHANGELOG.md", "w") as f:
              f.write(new_content)
          PY

          git add sync/ plugins/ .claude-plugin/marketplace.json CHANGELOG.md
          git reset HEAD sync/scripts/__pycache__/ || true
          git commit -m "sync: update gstack frameworks $(date +%Y-%m-%d) (v$NEW)"
          git push origin "$BRANCH"
          gh pr create \
            --title "Sync gstack frameworks $(date +%Y-%m-%d)" \
            --body "Automated sync of upstream gstack framework changes into Product Kit agents." \
            --base main \
            --head "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash --delete-branch
